<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANG Reading Stats</title>
  <meta name="description" content="Gere um cartão de estatísticas da sua sessão de leitura — páginas, ritmo e tempo — e baixe em PNG para compartilhar, no estilo dos cards do Strava." />
  <meta name="theme-color" content="#0d0d0d" />

  <meta property="og:title" content="ANG Reading Stats" />
  <meta property="og:description" content="Transforme sua sessão de leitura em um cartão compartilhável." />
  <meta property="og:type" content="website" />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <!-- ─────────────────────────────────────────────
       EXTERNAL DEPENDENCIES
       • html2canvas  – renders the card to PNG
       • Google Fonts – Bebas Neue (display) + Inter (body)
  ───────────────────────────────────────────── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="page-header">
    <div class="page-logo">ANG</div>
    <p class="page-tagline">Reading Stats · Share your session</p>
  </header>

  <main class="layout">

    <!-- ════════════════════════════
         PAINEL ESQUERDO: formulário
    ════════════════════════════ -->
    <section class="form-panel">

      <p class="section-label">Sessão de leitura</p>

      <div class="field">
        <label for="input-title">Título do livro</label>
        <input id="input-title" type="text" placeholder="Ex: Call Me by Your Name" autocomplete="off" />
      </div>

      <div class="field">
        <label for="input-author">Autor</label>
        <input id="input-author" type="text" placeholder="Ex: André Aciman" autocomplete="off" />
      </div>

      <div class="field">
        <label for="input-pages">Páginas lidas</label>
        <input id="input-pages" type="number" min="1" placeholder="Ex: 28" />
      </div>

      <div class="field">
        <label id="time-label">Tempo de leitura</label>
        <div class="field-row" role="group" aria-labelledby="time-label">
          <input id="input-hours"   type="number" min="0" max="23" placeholder="horas" aria-label="Horas" />
          <input id="input-minutes" type="number" min="0" max="59" placeholder="min"   aria-label="Minutos" />
        </div>
      </div>

      <div class="field">
        <label for="input-photo">Foto de fundo <span class="field-hint">(opcional)</span></label>
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="input-photo" accept="image/*" />
          <div class="upload-icon" aria-hidden="true">📷</div>
          <p class="upload-text">Arraste ou <strong>escolha uma foto</strong></p>
          <p class="upload-name" id="upload-name"></p>
        </div>
      </div>

      <button class="btn-generate" id="btn-generate">GERAR CARD</button>
      <button class="btn-download" id="btn-download">↓ BAIXAR PNG</button>

    </section>

    <!-- ════════════════════════════
         PAINEL DIREITO: preview
    ════════════════════════════ -->
    <section class="preview-panel">

      <p class="preview-label">Preview</p>

      <div id="reading-card">

        <!-- placeholder inicial -->
        <div id="card-placeholder">
          <span class="ph-icon" aria-hidden="true">📖</span>
          <p class="ph-text">Preencha os dados e clique em Gerar Card</p>
        </div>

        <!-- foto de fundo -->
        <div class="card-bg-photo"   id="card-bg-photo"></div>
        <div class="card-bg-overlay"></div>

        <!-- conteúdo do card -->
        <div class="card-inner">

          <div class="card-art">
            <!-- ╔══════════════════════════════════════╗
                 ║  LIVRO ABERTO SVG                    ║
                 ║  Troque este bloco para outro visual ║
                 ╚══════════════════════════════════════╝ -->
            <svg class="book-svg" viewBox="0 0 200 130" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <!-- spine -->
              <line x1="100" y1="14" x2="100" y2="120" stroke="rgba(233,30,140,0.65)" stroke-width="1.8"/>
              <!-- capa esquerda -->
              <path d="M10 18 Q10 10 18 10 L98 10 L98 120 L18 120 Q10 120 10 112 Z"
                    fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
              <!-- capa direita -->
              <path d="M190 18 Q190 10 182 10 L102 10 L102 120 L182 120 Q190 120 190 112 Z"
                    fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
              <!-- linhas página esquerda -->
              <g stroke="rgba(233,30,140,0.55)" stroke-width="1" stroke-linecap="round">
                <line x1="22" y1="28" x2="90" y2="28"/>
                <line x1="22" y1="38" x2="90" y2="38"/>
                <line x1="22" y1="48" x2="76" y2="48"/>
                <line x1="22" y1="58" x2="90" y2="58"/>
                <line x1="22" y1="68" x2="90" y2="68"/>
                <line x1="22" y1="78" x2="64" y2="78"/>
                <line x1="22" y1="88" x2="90" y2="88"/>
                <line x1="22" y1="98" x2="90" y2="98"/>
                <line x1="22" y1="108" x2="52" y2="108"/>
              </g>
              <!-- linhas página direita (mais suaves) -->
              <g stroke="rgba(233,30,140,0.28)" stroke-width="1" stroke-linecap="round">
                <line x1="110" y1="28" x2="178" y2="28"/>
                <line x1="110" y1="38" x2="164" y2="38"/>
                <line x1="110" y1="48" x2="178" y2="48"/>
                <line x1="110" y1="58" x2="178" y2="58"/>
                <line x1="110" y1="68" x2="148" y2="68"/>
                <line x1="110" y1="78" x2="178" y2="78"/>
                <line x1="110" y1="88" x2="178" y2="88"/>
                <line x1="110" y1="98" x2="156" y2="98"/>
                <line x1="110" y1="108" x2="178" y2="108"/>
              </g>
              <!-- glow no spine -->
              <circle cx="100" cy="65" r="3.5" fill="rgba(233,30,140,0.75)"/>
            </svg>
          </div>

          <div class="card-stats">

            <p class="card-eyebrow" id="card-eyebrow">Título do Livro · Autor</p>

            <!-- distância (primária) -->
            <div>
              <p class="stat-label">Distância</p>
              <p class="stat-value" id="card-pages">—<span class="stat-unit">págs</span></p>
            </div>

            <!-- pace + tempo (secundárias) -->
            <div class="card-row">
              <div>
                <p class="stat-label">Pace</p>
                <p class="stat-value" id="card-pace">—<span class="stat-unit">min/pág</span></p>
              </div>
              <div>
                <p class="stat-label">Tempo</p>
                <p class="stat-value" id="card-time">—</p>
              </div>
            </div>

            <div class="card-divider"></div>

            <div class="card-footer">
              <span class="card-logo">ANG</span>
            </div>

          </div>
        </div>
      </div><!-- /#reading-card -->

    </section>
  </main>

  <script src="js/app.js"></script>

</body>
</html>
